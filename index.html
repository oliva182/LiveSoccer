<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calcio Live · Champions · Europa League · Serie A</title>
<style>
  :root{
    --bg:#0b0f1a; --panel:#121a2b; --panel-2:#182136; --line:#232e47;
    --txt:#e8edf7; --dim:#8b96ad; --acc:#3fb6ff; --gold:#ffd76a;
    --ok:#4ade80; --bad:#f87171;
  }
  html{font-size:17px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#16233f 0%,var(--bg) 60%);color:var(--txt);min-height:100vh;padding:18px}
  .wrap{max-width:980px;margin:0 auto}

  .scoreboard{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:18px 22px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  .team{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
  .team img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(0,0,0,.5))}
  .team .name{font-weight:700;font-size:1.05rem;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
  .score-mid{text-align:center;min-width:190px}
  .score-line{font-size:2.6rem;font-weight:800;letter-spacing:2px;line-height:1}
  .status-pill{margin-top:8px;display:inline-flex;align-items:center;gap:7px;background:#0e1526;border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:.9rem;color:var(--dim)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .live .dot{background:var(--bad);animation:pulse 1.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(248,113,113,.5)}70%{box-shadow:0 0 0 9px rgba(248,113,113,0)}100%{box-shadow:0 0 0 0 rgba(248,113,113,0)}}
  .backbtn{margin:10px 0 2px;background:none;border:none;color:var(--acc);font-size:.9rem;cursor:pointer;padding:4px 2px}
  .backbtn:hover{text-decoration:underline}
  .lg-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .lg-tab{width:auto;margin:0;padding:9px 16px;border-radius:999px;background:#0e1526;color:var(--dim);border:1px solid var(--line);font-size:.9rem;font-weight:600;cursor:pointer;transition:filter .15s}
  .lg-tab:hover{filter:brightness(1.25)}
  .lg-tab.active{background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;border-color:transparent}
  .view-tabs{display:flex;gap:6px;margin-bottom:14px}
  .view-tab{flex:1;padding:8px 10px;border-radius:9px;background:var(--panel-2);color:var(--dim);border:1px solid var(--line);font-size:.85rem;font-weight:600;cursor:pointer}
  .view-tab.active{background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;border-color:transparent}
  .giornate{display:flex;flex-direction:column;gap:10px}
  .giornata{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .giornata summary{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;font-weight:700;font-size:.9rem;list-style:none}
  .giornata summary .g-date{flex:1;text-align:left;font-weight:400;color:var(--dim)}
  .giornata summary .g-num{flex:0 0 auto}
  .giornata summary .g-meta{flex:1;text-align:right}
  .giornata summary::-webkit-details-marker{display:none}
  .giornata summary::before{content:"▸";color:var(--dim);margin-right:2px}
  .giornata[open] summary::before{content:"▾"}
  .g-meta{font-weight:400;font-size:.78rem;color:var(--dim);text-transform:none;letter-spacing:.3px}
  .giornata .day-list{padding:4px 12px 12px}
  .empty-msg{text-align:center;padding:28px 10px;color:var(--dim)}
  .wk-cur{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;font-size:.95rem}
  .wk-nav{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}
  .lg-tab:disabled{opacity:.4;cursor:default}

  .tbl-wrap{overflow:auto;max-height:430px}
  table.cls{width:100%;border-collapse:collapse;font-size:.9rem;min-width:480px}
  table.cls th,table.cls td{padding:6px 10px;text-align:center;white-space:nowrap}
  table.cls th{color:var(--dim);font-size:.72rem;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--line)}
  table.cls th:first-child,table.cls td:first-child{padding-left:4px}
  table.cls thead th{position:sticky;top:0;background:var(--panel);z-index:1}
  table.cls tbody tr:nth-child(odd){background:rgba(255,255,255,.02)}
  td.team-cell{text-align:left;font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis}
  td.pts{font-weight:700}
  .zone-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
  .zone-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:12px;font-size:.76rem;color:var(--dim)}
  .zone-legend span{display:inline-flex;align-items:center;gap:5px}
  .day-list{display:flex;flex-direction:column;gap:8px}
  .day-row{display:grid;grid-template-columns:80px 1fr auto;gap:14px;align-items:center;background:var(--panel-2);border-radius:10px;padding:10px 14px;cursor:pointer;border:1px solid transparent}
  .day-row:hover,.day-row:focus{background:#131c2e;border-color:var(--line);outline:none}
  .dr-score{text-align:center;font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums;white-space:nowrap}
  .dr-teams{display:flex;flex-direction:column;gap:4px;min-width:0}
  .dr-team{display:flex;align-items:center;gap:8px;font-size:.95rem;min-width:0}
  .dr-team img{width:20px;height:20px;object-fit:contain;flex-shrink:0}
  .dr-status{white-space:nowrap}
  .st{font-size:.78rem;color:var(--dim);white-space:nowrap;text-transform:uppercase;letter-spacing:.6px}
  .st.live{color:#4ade80;display:inline-flex;align-items:center;gap:7px}
  .st.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#4ade80;animation:pulse 1.2s infinite}
  .ht-score{margin-top:6px;font-size:.78rem;color:var(--dim)}
  .match-highlights{display:flex;justify-content:space-between;gap:18px;margin-top:10px;font-size:.84rem;color:var(--dim);width:100%;text-align:left}
  .highlight-team{display:flex;flex-direction:column;gap:3px;min-width:0;max-width:185px}
  .highlight-team.away{text-align:right}
  .highlight-title{font-size:.76rem;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .highlight-item{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .highlight-item b{color:var(--txt);font-variant-numeric:tabular-nums;margin-right:3px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  @media (max-width:760px){.grid{grid-template-columns:1fr}}
  .grid.single{grid-template-columns:1fr}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .panel h2{font-size:.95rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin-bottom:14px}

  .stats-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:32px}
  @media (max-width:760px){.stats-grid{grid-template-columns:1fr}}
  .stat-row{margin-bottom:13px}
  .stat-row .lbl{display:flex;justify-content:space-between;font-size:.95rem;color:var(--dim);margin-bottom:4px}
  .stat-row .lbl b{color:var(--txt);font-variant-numeric:tabular-nums}
  .bar{height:7px;border-radius:4px;background:#0e1526;overflow:hidden;display:flex}
  .bar .l{background:var(--acc);transition:width .8s ease}
  .bar .r{background:#a78bfa;transition:width .8s ease;margin-left:auto}

  .timeline{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:6px}
  .ev{display:grid;grid-template-columns:56px 1fr;gap:8px;align-items:center;background:var(--panel-2);border-radius:10px;padding:8px 10px;font-size:1rem}
  @keyframes flash{from{background:#1e3a5f}}
  .ev .min{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums;font-size:.9rem}
  .ev .who b{display:block}
  .ev .who span{color:var(--dim);font-size:.88rem}
  .ev .ico{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.18em;margin-right:.25em;line-height:1}
  .whistle-svg svg{width:1.05em;height:1.05em;display:block;color:#cbd5e1}
  .sub-svg svg{width:1.05em;height:1.05em;display:block;color:#4ade80}

  .lineups{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:760px){.lineups{grid-template-columns:1fr}}
  .roster-col{background:var(--panel-2);border-radius:10px;padding:12px;font-size:.92rem;max-height:430px;overflow-y:auto}
  .roster-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:.95rem;gap:10px}
  .formation{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .rlabel{margin:10px 0 4px;font-size:.76rem;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}
  .prow{display:grid;grid-template-columns:28px 46px 1fr auto;gap:8px;align-items:center;padding:3px 6px;border-radius:6px}
  .prow:nth-child(odd){background:rgba(255,255,255,.02)}
  .prow .num{color:var(--dim);font-variant-numeric:tabular-nums;text-align:center}
  .prow .pos{color:var(--acc);font-size:.78rem;letter-spacing:.4px}
  .prow .pname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow.out .pname{text-decoration:line-through;color:var(--dim)}
  .prow.in .pname{color:var(--ok)}
  .prow .pmute{color:var(--dim);font-size:.82rem;font-variant-numeric:tabular-nums;white-space:nowrap}
  .chg{padding:3px 6px;font-size:.92rem;color:var(--dim)}
  .chg b{color:var(--txt);margin-right:4px;font-variant-numeric:tabular-nums}
  .arrow{color:var(--gold)}

  .setup{max-width:560px;margin:40px auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
  .setup h1{font-size:1.3rem;margin-bottom:6px}
  .setup p,.setup li{color:var(--dim);font-size:.92rem;line-height:1.5}
  .setup ul{margin:12px 0 16px 18px}
  input[type=password]{width:100%;background:#0e1526;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 13px;font-size:.95rem;margin-top:8px;outline:none}
  input:focus{border-color:var(--acc)}
  button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(90deg,#2563eb,#7c3aed);color:#fff;font-weight:700;font-size:.95rem;cursor:pointer}
  button:hover{filter:brightness(1.15)}
  .hint{font-size:.8rem;color:var(--dim);margin-top:10px;line-height:1.45}
  a{color:var(--acc)}

  .countdown{text-align:center;padding:30px 10px}
  .cd-num{font-size:2.2rem;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums}
  .cd-lbl{color:var(--dim);font-size:.85rem;text-transform:uppercase;letter-spacing:1.4px;margin-top:6px}

  .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding:10px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-size:.88rem;color:var(--dim);flex-wrap:wrap}
  .foot select{background:#0e1526;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:5px 9px;font-size:.8rem;margin:0}
  .quota-bar{flex:1;min-width:120px;max-width:200px;height:6px;background:#0e1526;border-radius:3px;overflow:hidden;margin-left:auto}
  .quota-bar div{height:100%;background:var(--ok);transition:width .4s}

  .flash-score{animation:scorepop .6s ease}
  @keyframes scorepop{0%{transform:scale(1.35);color:var(--gold)}100%{transform:scale(1)}}
  .muted{color:var(--dim);font-size:.9rem;text-align:center;padding:26px}
  .err{color:var(--bad);font-size:.85rem;margin-top:10px;min-height:1.2em}
  /* ===== temi extra: cartoon / sketch (default = stadio, §13.1) ===== */
  @keyframes blinkSoft{0%,100%{opacity:1}50%{opacity:.3}}
  @keyframes cartoonPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.7)}}
  @keyframes cartoonPop{0%{color:var(--gold);transform:scale(1.4) rotate(-4deg)}100%{transform:none}}
  @keyframes inkWiggle{0%{color:var(--bad);transform:rotate(-3deg) scale(1.25)}60%{transform:rotate(2deg)}100%{transform:none}}

  html[data-theme="cartoon"]{--bg:#fdf3d8;--panel:#fffdf7;--panel-2:#ffefc2;--line:#1a1a1a;--txt:#1a1a1a;--dim:#6b6475;--acc:#ff6b35;--gold:#ffd400;--ok:#2ec27e;--bad:#ff3b3b}
  html[data-theme="cartoon"] body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:repeating-linear-gradient(45deg,var(--bg) 0 26px,#fbeec9 26px 52px)}
  html[data-theme="cartoon"] .scoreboard,html[data-theme="cartoon"] .panel,html[data-theme="cartoon"] .foot{border-width:3px}
  html[data-theme="cartoon"] .scoreboard{box-shadow:6px 6px 0 rgba(26,26,26,.9)}
  html[data-theme="cartoon"] .status-pill,html[data-theme="cartoon"] .lg-tab,html[data-theme="cartoon"] .bar,html[data-theme="cartoon"] .foot select{background:#fffdf7}
  html[data-theme="cartoon"] .lg-tab.active{background:var(--acc);color:#fff;border-color:#1a1a1a}
  html[data-theme="cartoon"] button{background:var(--gold);border:2px solid #1a1a1a;color:#1a1a1a;box-shadow:3px 3px 0 rgba(26,26,26,.9)}
  html[data-theme="cartoon"] .bar .r{background:#3aa0ff}
  html[data-theme="cartoon"] .live .dot,html[data-theme="cartoon"] .st.live::before{animation:cartoonPulse 1.2s infinite;background:var(--bad)}
  html[data-theme="cartoon"] .flash-score{animation-name:cartoonPop}

  html[data-theme="sketch"]{--bg:#f4eee0;--panel:#fffcf5;--panel-2:#f3ecd9;--line:#b7a98c;--txt:#262630;--dim:#7d7668;--acc:#d0561e;--gold:#a9780a;--ok:#2e7d32;--bad:#c0392b}
  html[data-theme="sketch"] body{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;background:var(--bg)}
  html[data-theme="sketch"] .panel,html[data-theme="sketch"] .scoreboard,html[data-theme="sketch"] .day-row,html[data-theme="sketch"] .foot{border-width:2px;border-radius:14px 25px 16px 26px/25px 14px 27px 15px}
  html[data-theme="sketch"] .scoreboard{box-shadow:3px 4px 0 rgba(38,38,48,.18)}
  html[data-theme="sketch"] .status-pill,html[data-theme="sketch"] .lg-tab,html[data-theme="sketch"] .bar,html[data-theme="sketch"] .foot select{background:#fffdf7}
  html[data-theme="sketch"] .lg-tab{border-style:dashed}
  html[data-theme="sketch"] .lg-tab.active{background:var(--acc);color:#fff;border-color:transparent}
  html[data-theme="sketch"] button{background:var(--acc)}
  html[data-theme="sketch"] .day-row:hover,html[data-theme="sketch"] .day-row:focus{background:#efe6cf}
  html[data-theme="sketch"] table.cls thead th{background:var(--panel)}
  html[data-theme="sketch"] .bar .r{background:#8a6db1}
  html[data-theme="sketch"] .live .dot,html[data-theme="sketch"] .st.live::before{animation:blinkSoft 1.2s infinite;background:var(--bad)}
  html[data-theme="sketch"] .flash-score{animation-name:inkWiggle}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
"use strict";
/* ===== Calcio Live — dashboard live ESPN Soccer (vanilla JS, no deps) ===== */
/* exp = partite per giornata (squadre/2): Serie A/PL/La Liga 20 squadre → 10, Bundesliga/Ligue 1 18 → 9 */
const LEAGUES = [
  { slug: "uefa.champions", name: "Champions League" },
  { slug: "uefa.europa", name: "Europa League" },
  { slug: "uefa.europa.conf", name: "Conference League" },
  { slug: "ita.1", name: "Serie A", exp: 10 },
  { slug: "eng.1", name: "Premier League", exp: 10 },
  { slug: "esp.1", name: "La Liga", exp: 10 },
  { slug: "ger.1", name: "Bundesliga", exp: 9 },
  { slug: "fra.1", name: "Ligue 1", exp: 9 },
];
const STANDINGS_TTL = 15 * 60 * 1000;
// fetch diretto: site.web.api.espn.com è l'host ESPN che risponde al browser (200 + CORS *) — nessun server
const BASE = (slug) => `https://site.web.api.espn.com/apis/site/v2/sports/soccer/${slug}`;
const STANDINGS_URL = (slug) => `https://site.web.api.espn.com/apis/v2/sports/soccer/${slug}/standings`;
const SS_EVENT = "cldash_espn_event_id", SS_SPORT = "cldash_espn_sport", SS_LEAGUE = "cldash_espn_league", SS_THEME = "cldash_theme", SS_VIEW = "cldash_view";
const GONE_MSG = "L'evento ESPN non è più disponibile.";
const OFFSETS = [0, -1, 1, -2, 2];

const S = {
  matchId: null, sport: null, league: "ita.1",
  match: null, summary: null, stats: null, standings: null,
  pollMs: 60000, calls: 0, lastUpdated: null, error: null, lastScore: null,
  events: [], dayOffset: 0, landingReady: false,
  view: "oggi", season: null, weekSel: null,
};
let pollTimer = null, cdTimer = null;

/* ===== utils ===== */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const el = (id) => document.getElementById(id);
const validLeag = (slug) => LEAGUES.some((l) => l.slug === slug) ? slug : null;
const leagueName = (slug) => (LEAGUES.find((l) => l.slug === slug) || {}).name || "";
const ssGet = (k) => { try { return sessionStorage.getItem(k); } catch (_) { return null; } };
const ssSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch (_) {} };
const ssDel = (k) => { try { sessionStorage.removeItem(k); } catch (_) {} };
const isNum = (v) => typeof v === "number" && isFinite(v);
const numOrNull = (v) => (v == null || v === "" ? null : isFinite(Number(v)) ? Number(v) : null);

async function apiGet(url) {
  S.calls++;
  const r = await fetch(url, { headers: { Accept: "application/json" } });
  if (!r.ok) throw new Error(`ESPN HTTP ${r.status}`);
  return r.json();
}
const dateStr = (off) => { const d = new Date(Date.now() + off * 864e5); return `${d.getUTCFullYear()}${String(d.getUTCMonth() + 1).padStart(2, "0")}${String(d.getUTCDate()).padStart(2, "0")}`; };
const kickoffTime = (d) => new Date(d).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });

/* ===== temi (extra rispetto alla spec §13.1) ===== */
const THEMES = [
  { slug: "stadio", label: "Stadio" },
  { slug: "cartoon", label: "Cartoon" },
  { slug: "sketch", label: "Sketch" },
];
const isCup = (slug) => String(slug || "").startsWith("uefa.");
function currentTheme() { return THEMES.some((t) => t.slug === ssGet(SS_THEME)) ? ssGet(SS_THEME) : "stadio"; }
function setTheme(t) { document.documentElement.dataset.theme = t; ssSet(SS_THEME, t); const s = el("themeSel"); if (s) s.value = t; }

/* ===== caricamento dati (§6-§8) ===== */
async function fetchDay(slug, offset) {
  const data = await apiGet(`${BASE(slug)}/scoreboard?dates=${dateStr(offset)}&limit=100`);
  return { lg: slug, events: data.events || [] };
}

async function findEvent(id) {
  for (const off of OFFSETS) {
    const groups = await Promise.all(LEAGUES.map((l) => fetchDay(l.slug, off).catch(() => ({ lg: l.slug, events: [] }))));
    for (const g of groups) {
      const ev = g.events.find((e) => String(e.id) === String(id));
      if (ev) return { event: ev, offset: off, slug: g.lg };
    }
  }
  return null;
}

/* ===== stagione (Calendario/Storico) ===== */
async function loadSeason() {
  if (S.season && S.season.slug === S.league && Date.now() - S.season.at < STANDINGS_TTL) return;
  const now = new Date();
  const y = now.getUTCMonth() >= 6 ? now.getUTCFullYear() : now.getUTCFullYear() - 1;
  const data = await apiGet(`${BASE(S.league)}/scoreboard?dates=${y}0701-${y + 1}0630&limit=500`);
  S.season = { slug: S.league, at: Date.now(), events: data.events || [] };
}

/* Giornata: leghe ven→lun, coppe europee mar→gio */
const weekKey = (d, sport) => { const dt = new Date(d); const start = sport.startsWith("uefa.") ? 2 : 5; const day = (dt.getUTCDay() - start + 7) % 7; dt.setUTCDate(dt.getUTCDate() - day); return dt.toISOString().slice(0, 10); };
const todayKey = () => weekKey(new Date(), S.league);
const dayFmt = (d) => new Date(d).toLocaleDateString("it-IT", { day: "numeric", month: "short" });

function seasonGroupsAll() {
  const evs = S.season && S.season.slug === S.league ? S.season.events : [];
  const map = new Map();
  for (const ev of evs) {
    const k = weekKey(ev.date, S.league);
    (map.get(k) || map.set(k, []).get(k)).push(ev);
  }
  // Turno infrasettimanale: una week con 2x partite (es. 20 in Serie A) si divide in giornate da `exp` partite
  // (le prime restano, il resto diventa la week successiva facendo scalare il numeramento)
  const exp = (LEAGUES.find((l) => l.slug === S.league) || {}).exp || 0;
  const todayStr = new Date().toISOString().slice(0, 10);
  const flat = [];
  for (const [key, evs] of [...map.entries()].sort((a, b) => a[0].localeCompare(b[0]))) {
    evs.sort((a, b) => String(a.date).localeCompare(String(b.date)));
    const step = exp || evs.length;
    for (let i = 0; i < evs.length; i += step) flat.push({ key: i ? `${key}-${i / step + 1}` : key, evs: evs.slice(i, i + step) });
  }
  const openIdx = flat.reduce((acc, g, i) => (g.evs[0].date.slice(0, 10) <= todayStr ? i : acc), -1);
  return flat.map((g, i) => {
    const live = g.evs.filter((e) => e.competitions?.[0]?.status?.type?.state === "in").length;
    const d0 = new Date(g.evs[0].date), d1 = new Date(g.evs[g.evs.length - 1].date);
    const label = d0.toISOString().slice(0, 10) === d1.toISOString().slice(0, 10) ? dayFmt(d0) : `${dayFmt(d0)} – ${dayFmt(d1)}`;
    const meta = live ? `${g.evs.length} partite · ${live} in corso` : `${g.evs.length} partite`;
    return { key: g.key, n: i + 1, label, meta, evs: g.evs, open: i === openIdx };
  });
}

async function loadStandings() {
  const c = S.standings;
  if (c && c.slug === S.league && Date.now() - c.at < STANDINGS_TTL) return;
  try {
    const st = await apiGet(STANDINGS_URL(S.league));
    S.standings = { slug: S.league, at: Date.now(), entries: (st.children?.[0]?.standings?.entries) || [] };
  } catch (_) { /* §12: errore classifica ignorato */ }
}

async function loadLanding() {
  if (S.view === "oggi" && isCup(S.league)) {
    const day = await fetchDay(S.league, 0);
    await loadStandings();
    S.events = [day];
    S.dayOffset = 0;
    S.landingReady = true;
    S.lastUpdated = new Date();
    return;
  }
  await loadSeason();
  if (S.view === "oggi") await loadStandings();
  S.landingReady = true;
  S.lastUpdated = new Date();
}

/* evento già in memoria (stagione) prima di battere l'API: ±2 giorni non coprono lo Storico */
async function resolveMatch(id) {
  const lg = S.sport || S.league;
  if (S.season && S.season.slug === lg) {
    const ev = S.season.events.find((e) => String(e.id) === String(id));
    if (ev) return { event: ev, offset: 0, slug: S.season.slug };
  }
  return findEvent(id);
}

async function loadMatch() {
  const found = await resolveMatch(S.matchId);
  if (!found) throw new Error(GONE_MSG);
  S.match = found.event;
  S.dayOffset = found.offset;
  if (found.slug) {
    S.sport = found.slug; S.league = found.slug;
    ssSet(SS_SPORT, found.slug); ssSet(SS_LEAGUE, found.slug);
  }
}

async function loadSummary() {
  const data = await apiGet(`${BASE(S.sport || S.league)}/summary?event=${encodeURIComponent(S.matchId)}`);
  S.summary = data;
  S.stats = normalizeStats(data.boxscore);
}

/* §8.1 */
function normalizeStats(box) {
  const rows = box?.teams || (box?.team ? [box.team] : null);
  if (!rows || !rows.length) return null;
  return rows.map((row) => {
    const st = row.statistics || row.stats || [];
    const findVal = (names) => {
      for (const n of names) {
        const s = st.find((x) => (x.name || x.label || "").toLowerCase() === n.toLowerCase());
        if (s != null) return numOrNull(s.displayValue ?? s.value);
      }
      return null;
    };
    const possession = findVal(["possessionPct", "possession", "ball possession"]);
    const shots = findVal(["totalShots", "shots", "total shots"]);
    const onTarget = findVal(["shotsOnTarget", "shots on target", "shots on goal"]);
    const blocked = findVal(["blockedShots", "blocked shots"]);
    const corners = findVal(["wonCorners", "corner kicks", "corners"]);
    const fouls = findVal(["foulsCommitted", "fouls"]);
    const offsides = findVal(["offsides"]);
    const yellow = findVal(["yellowCards", "yellow cards"]);
    let offTarget = null;
    if (isNum(shots) && isNum(onTarget)) offTarget = Math.max(0, shots - onTarget - (blocked || 0));
    return { team: row.team || {}, possession, shots, onTarget, offTarget, corners, fouls, offsides, yellow };
  });
}

const friendlyErr = (e) => e instanceof TypeError ? "Errore di rete verso ESPN." : String(e?.message || e);

async function apply() {
  try {
    if (S.matchId) await Promise.all([loadMatch(), loadSummary()]);
    else await loadLanding();
    S.error = null;
    S.lastUpdated = new Date();
  } catch (e) {
    S.error = friendlyErr(e);
  }
  render();
}

async function boot() {
  stopTimers();
  const urlEv = new URLSearchParams(location.search).get("event");
  if (urlEv) ssSet(SS_EVENT, urlEv);
  S.matchId = ssGet(SS_EVENT) || null;
  S.sport = validLeag(ssGet(SS_SPORT));
  S.league = validLeag(ssGet(SS_LEAGUE)) || "ita.1";
  S.view = ["oggi", "cal", "hist"].includes(ssGet(SS_VIEW)) ? ssGet(SS_VIEW) : "oggi";
  if (!isCup(S.league) && S.view === "hist") { S.view = "oggi"; ssSet(SS_VIEW, "oggi"); }
  S.weekSel = null;
  render();
  if (S.matchId) {
    if (S.view !== "oggi") await loadSeason().catch(() => {});
    const found = await resolveMatch(S.matchId).catch(() => null);
    if (!found) { ssDel(SS_EVENT); S.matchId = null; }
    else {
      S.match = found.event; S.dayOffset = found.offset;
      if (found.slug) { S.sport = found.slug; S.league = found.slug; ssSet(SS_SPORT, found.slug); ssSet(SS_LEAGUE, found.slug); }
      try { await loadSummary(); } catch (e) { S.error = friendlyErr(e); }
      S.lastUpdated = new Date();
    }
  }
  if (!S.matchId && !S.landingReady) { try { await loadLanding(); S.error = null; } catch (e) { S.error = friendlyErr(e); } }
  startTimers();
  render();
}

/* ===== timer ===== */
function stopTimers() { if (pollTimer) clearInterval(pollTimer); if (cdTimer) clearInterval(cdTimer); pollTimer = cdTimer = null; }
function startTimers() {
  stopTimers();
  pollTimer = setInterval(poll, S.pollMs);
  cdTimer = setInterval(tickCountdown, 1000);
}

async function poll() { await apply(); }

}

    : [["oggi", "Week in corso"], ["cal", "Calendario"]];

function seasonPanelHtml() {
  const cup = isCup(S.league);
  const title = cup && S.view === "hist" ? `Storico · ${esc(leagueName(S.league))}` : `Calendario · ${esc(leagueName(S.league))}`;
  const all = seasonGroupsAll();
  const tk = todayKey();
  let groups, openKey, emptyTxt;
  if (cup) {
    if (S.view === "cal") { groups = all.filter((g) => g.key >= tk); openKey = tk; emptyTxt = "prossima"; }
    else { groups = all.filter((g) => g.key < tk).reverse(); openKey = groups[0]?.key; emptyTxt = "registrata"; }
  } else { groups = all; openKey = tk; emptyTxt = "prossima"; }
  const dt = (ev) => (ev.date ? `${new Date(ev.date).toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "short" })} · ${kickoffTime(ev.date)}` : "");
  groups = groups.map((g) => ({ ...g, open: cup ? g.key === openKey : g.open, evs: g.evs.map((e) => dayRowHtml(e, cup ? null : dt(e))) }));
  if (!groups.length) return `<section class="panel"><h2>${title}</h2><p class="empty-msg">Nessuna giornata ${emptyTxt} in questa stagione.</p></section>`;
  const sec = (g) => `<details class="giornata" ${g.open ? "open" : ""}>

    <div class="day-list">${g.evs.join("")}</div>
  </details>`;
  return `<section class="panel"><h2>${title}</h2><div class="giornate">${groups.map(sec).join("")}</div></section>`;
}

function dayRowHtml(ev, dt) {
  const comp = ev.competitions?.[0];
  const home = comp?.competitors?.find((c) => c.homeAway === "home");
  const away = comp?.competitors?.find((c) => c.homeAway === "away");
  const st = comp?.status?.type || {};
  const date = ev.date ? new Date(ev.date) : null;
  const liveClock = st.state === "in" && st.displayClock ? ` · ${esc(st.displayClock)}` : "";
  let statusBadge, scoreCell;
  if (st.state === "in") { statusBadge = `<span class="st live">In corso${liveClock}</span>`; scoreCell = `${home?.score ?? 0} : ${away?.score ?? 0}`; }
  else if (st.state === "post") { statusBadge = dt ? `<span class="st">${esc(dt)}</span>` : `<span class="st">Finale</span>`; scoreCell = `${home?.score ?? 0} : ${away?.score ?? 0}`; }
  else if (dt) { statusBadge = `<span class="st">${esc(dt)}</span>`; scoreCell = ""; }
  else { statusBadge = `<span class="st">${date ? esc(kickoffTime(date)) : ""}</span>`; scoreCell = date ? esc(kickoffTime(date)) : ""; }
  const teamLine = (c) => `<div class="dr-team">${c?.team?.logo ? `<img src="${esc(c.team.logo)}" alt="">` : ""}<span>${esc(c?.team?.displayName || "?")}</span></div>`;
  return `<div class="day-row" role="button" tabindex="0" data-match="${esc(String(ev.id))}">
    <div class="dr-score">${scoreCell}</div>
    <div class="dr-teams">${teamLine(home)}${teamLine(away)}</div>
    <div class="dr-status">${statusBadge}</div>
  </div>`;
}

function dayPanelHtml() {
  const group = (S.events.find((g) => g.lg === S.league)) || { events: [] };
  const events = [...group.events].sort((a, b) => String(a.date).localeCompare(String(b.date)));
  if (!events.length) return `<section class="panel"><h2>Partite di oggi · ${esc(leagueName(S.league))}</h2><p class="empty-msg">Spiacente, nessun match oggi!</p></section>`;
  return `<section class="panel"><h2>Partite di oggi · ${esc(leagueName(S.league))}</h2><div class="day-list">${events.map(dayRowHtml).join("")}</div></section>`;
}

function statVal(entry, name) {
  const s = (entry.stats || []).find((x) => x.name === name);
  return s ? s.displayValue : null;
}
function zoneOf(entry) {
  const d = entry.note?.description || "";
  return { desc: d, color: d === "Knockout phase playoffs - seeded" ? "#FF9E2C" : (entry.note?.color || "") };
}

function standingsPanelHtml() {
  let entries = S.standings && S.standings.slug === S.league ? S.standings.entries : null;
  if (!entries || !entries.length) return `<section class="panel"><h2>Classifica · ${esc(leagueName(S.league))}</h2><p class="muted">Classifica non disponibile al momento.</p></section>`;
  entries = [...entries].sort((a, b) => (numOrNull(statVal(a, "rank")) || 0) - (numOrNull(statVal(b, "rank")) || 0));
  const zones = [];
  for (const e of entries) { const z = zoneOf(e); if (z.desc && !zones.some((x) => x.desc === z.desc)) zones.push(z); }
  const legend = zones.length ? `<div class="zone-legend">${zones.map((z) => `<span><i class="zone-dot" style="background:${esc(z.color)}"></i>${esc(z.desc)}</span>`).join("")}</div>` : "";
  const rows = entries.map((e, i) => {
    const t = e.team || {}; const z = zoneOf(e);
    return `<tr><td><i class="zone-dot" style="background:${esc(z.color)}"></i>${i + 1}</td>
      <td class="team-cell" title="${esc(t.name || "")}">${esc(t.shortDisplayName || t.name || "?")}</td>
      <td>${esc(statVal(e, "gamesPlayed") ?? "")}</td><td>${esc(statVal(e, "wins") ?? "")}</td>
      <td>${esc(statVal(e, "ties") ?? "")}</td><td>${esc(statVal(e, "losses") ?? "")}</td>
      <td>${esc(statVal(e, "pointDifferential") ?? "")}</td><td class="pts">${esc(statVal(e, "points") ?? "")}</td></tr>`;
  }).join("");
  return `<section class="panel"><h2>Classifica · ${esc(leagueName(S.league))}</h2>${legend}
    <div class="tbl-wrap"><table class="cls"><thead><tr><th>#</th><th>Squadra</th><th>G</th><th>V</th><th>N</th><th>P</th><th>DR</th><th>Pt</th></tr></thead>
    <tbody>${rows}</tbody></table></div></section>`;
}

function bootPanelHtml() {
  if (S.error) return `<section class="panel"><h2>Errore</h2><p style="color:var(--bad);line-height:1.5">${esc(S.error)}</p><button type="button" data-act="retry">Riprova</button></section>`;

}

function errBannerHtml() { return S.error ? `<div class="err">Ultimo aggiornamento fallito: ${esc(S.error)}</div>` : ""; }

function footerHtml() {

  const themeOpts = THEMES.map((t) => `<option value="${esc(t.slug)}"${currentTheme() === t.slug ? " selected" : ""}>${esc(t.label)}</option>`).join("");

  </div>`;

function weekPanelHtml() {
  const all = seasonGroupsAll();
  const tk = todayKey();
  const dt = (ev) => (ev.date ? `${new Date(ev.date).toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "short" })} · ${kickoffTime(ev.date)}` : "");
  let idx = all.findIndex((g) => (S.weekSel ? g.key === S.weekSel : g.open));
  if (idx < 0) { idx = all.findIndex((g) => g.key > tk); if (idx < 0) idx = all.length; }
  const g = idx < all.length && (S.weekSel ? all[idx].key === S.weekSel : all[idx].open) ? all[idx] : null;
  const prev = idx > 0 ? all[idx - 1] : null;
  const next = g ? (idx + 1 < all.length ? all[idx + 1] : null) : (idx < all.length ? all[idx] : null);
  const navBtn = (dir, key, label) => `<button type="button" class="lg-tab" data-nav="${dir}"${key ? ` data-key="${esc(key)}"` : " disabled"}>${label}</button>`;
  const nav = `<div class="wk-nav">${navBtn("prev", prev?.key, "‹ Giornata precedente")}${navBtn("next", next?.key, "Giornata successiva ›")}</div>`;
  const title = g ? `Week ${g.n} · ${g.label}` : "Nessuna partita in questa settimana";
  const body = g
    ? `<div class="wk-cur"><b>${esc(title)}</b><span class="g-meta">${esc(g.meta)}</span></div><div class="day-list">${g.evs.map((e) => dayRowHtml(e, dt(e))).join("")}</div>`
    : `<p class="empty-msg">Nessuna partita in questa settimana.</p>`;

}

function renderLanding() {
  let h = tabsHtml() + viewTabsHtml();
  if (!S.landingReady) h += bootPanelHtml();
  else if (S.view === "oggi") h += (isCup(S.league) ? dayPanelHtml() : weekPanelHtml()) + standingsPanelHtml() + errBannerHtml();
  else h += seasonPanelHtml() + errBannerHtml();
  h += footerHtml();
  return h;
}

/* ===== render PARTITA (§10) ===== */
function matchStatus() {
  const comp = S.match?.competitions?.[0];
  const st = comp?.status?.type || S.match?.status?.type || {};
  const label = st.detail || st.shortDetail || st.state || "Stato sconosciuto";
  const live = st.state === "in" || (/live|half|intermission|postponed/i.test(label) && !/final/i.test(label));
  return { state: st.state, label, clock: st.displayClock, live };
}

function highlightColHtml(teamId, teamName, homeId, keyEvents) {
  const evs = (keyEvents || []).filter((ev) => ev.team && String(ev.team.id) === String(teamId) && /goal|yellow-card|red-card/i.test(String(ev.type?.type || "")));
  if (!evs.length) return `<div class="highlight-team"><div class="highlight-title">${esc(teamName)}</div></div>`;
  const iconFor = (t) => (t.includes("red-card") ? "🟥" : t.includes("yellow-card") ? "🟨" : "⚽");
  const items = evs.map((ev) => {
    const t = String(ev.type?.type || "").toLowerCase();
    const p = ev.participants?.[0];
    const author = p?.athlete?.displayName || (ev.shortText || "").replace(/\s*(Goal|Yellow Card|Red Card)$/i, "") || "Evento";
    return `<div class="highlight-item"><b>${esc(ev.clock?.displayValue || "–")}</b>${iconFor(t)} ${esc(author)}</div>`;
  }).join("");
  return `<div class="highlight-team${teamId !== homeId ? " away" : ""}"><div class="highlight-title">${esc(teamName)}</div>${items}</div>`;
}

function highlightsHtml() {
  const comp = S.match?.competitions?.[0];
  if (!comp) return "";
  const home = comp.competitors.find((c) => c.homeAway === "home");
  const away = comp.competitors.find((c) => c.homeAway === "away");

  const hn = home?.team?.shortDisplayName || home?.team?.displayName || "";
  const an = away?.team?.shortDisplayName || away?.team?.displayName || "";

function scoreboardHtml() {

function countdownHtml() {
  const stt = matchStatus();
  if (!S.match.date || stt.live || /final|cancel|postpon/i.test(stt.label)) return "";
  const diff = new Date(S.match.date).getTime() - Date.now();
  if (diff <= 0) return "";
  const d = Math.floor(diff / 864e5), h = Math.floor(diff / 36e5) % 24, m = Math.floor(diff / 6e4) % 60, s = Math.floor(diff / 1000) % 60;
  const box = (v, l, u) => `<div><div class="cd-num" data-u="${u}">${String(v).padStart(2, "0")}</div><div class="cd-lbl">${esc(l)}</div></div>`;
  return `<section class="panel"><div class="countdown">
    ${d > 0 ? box(d, "giorni", "d") : ""}${box(h, "ore", "h")}${box(m, "minuti", "m")}${box(s, "secondi", "s")}
  </div><div style="margin-top:18px;color:var(--dim)">Fischio d'inizio: ${esc(new Date(S.match.date).toLocaleString("it-IT"))}</div></section>`;
}

function statsPanelHtml() {
  const comp = S.match?.competitions?.[0];
  const homeId = comp?.competitors?.find((c) => c.homeAway === "home")?.team?.id;
  const awayId = comp?.competitors?.find((c) => c.homeAway === "away")?.team?.id;
  if (!S.stats || !S.stats.length) return `<section class="panel"><h2>Statistiche live</h2><p class="muted">Statistiche non ancora disponibili dal feed ESPN.</p></section>`;
  const hr = S.stats.find((r) => String(r.team?.id) === String(homeId)) || S.stats[0];
  const ar = S.stats.find((r) => String(r.team?.id) === String(awayId)) || (S.stats.length > 1 ? S.stats[1] : S.stats[0]);
  const rowsDef = [
    ["Possesso palla", "possession", true], ["Tiri totali", "shots"], ["Tiri in porta", "onTarget"],
    ["Tiri fuori", "offTarget"], ["Angoli", "corners"], ["Falli", "fouls"], ["Fuorigioco", "offsides"], ["Gialli", "yellow"],
  ];
  const fmt = (v, pct) => v == null ? "–" : (pct ? `${v}%` : String(v));
  const rowHtml = ([label, key, pct]) => {
    const hv = hr[key], av = ar[key];
    const tot = (isNum(hv) ? hv : 0) + (isNum(av) ? av : 0);
    const total = tot > 0 ? tot : 1;
    const wl = isNum(hv) ? (hv / total * 50).toFixed(2) + "%" : "0%";
    const wr = isNum(av) ? (av / total * 50).toFixed(2) + "%" : "0%";
    return `<div class="stat-row"><div class="lbl"><b>${esc(fmt(hv, pct))}</b><span>${esc(label)}</span><b>${esc(fmt(av, pct))}</b></div>
      <div class="bar"><div class="l" style="width:${wl}"></div><div class="r" style="width:${wr}"></div></div></div>`;
  };
  return `<section class="panel"><h2>Statistiche live</h2><div class="stats-grid">${rowsDef.map(rowHtml).join("")}</div></section>`;
}

/* §10.5 Formazioni e cambi */
function isSub(ev) { return /sub/i.test(String(ev.type?.type || "")) || /substitution/i.test(`${ev.text || ""} ${ev.type?.text || ""}`); }

function subsMap() {
  const inMin = {}, outMin = {};
  for (const ev of S.summary?.keyEvents || []) {
    if (!isSub(ev)) continue;
    const min = ev.clock?.displayValue;
    const p0 = ev.participants?.[0]?.athlete, p1 = ev.participants?.[1]?.athlete;
    if (p0 && min) inMin[p0.id] = min;
    if (p1 && min) outMin[p1.id] = min;
  }
  return { inMin, outMin };
}

function rosterColHtml(r, homeId, subs) {
  const tid = String(r.team?.id);
  const players = r.roster || [];
  const byJersey = (a, b) => Number(a.jersey || 0) - Number(b.jersey || 0);
  const starters = players.filter((p) => p.starter === true).sort(byJersey);
  const bench = players.filter((p) => p.starter !== true).sort(byJersey);
  const nameOf = (a) => a?.athlete?.fullName || a?.athlete?.displayName || "?";
  const prowHtml = (p) => {
    const aid = p.athlete?.id;
    const isIn = !!subs.inMin[aid] && p.starter !== true;
    const isOut = p.subbedOut === true;
    const cls = isOut ? " out" : (isIn ? " in" : "");
    const badge = subs.outMin[aid] ? `⏱ ${esc(subs.outMin[aid])}` : (subs.inMin[aid] ? `✓ ${esc(subs.inMin[aid])}` : "");
    return `<div class="prow${cls}"><span class="num">${esc(p.jersey ?? "")}</span><span class="pos" title="${esc(p.position?.name || "")}">${esc(p.position?.abbreviation || "")}</span><span class="pname">${esc(nameOf(p))}</span><span class="pmute">${badge}</span></div>`;
  };
  const changes = [];
  for (const ev of S.summary?.keyEvents || []) {
    if (!isSub(ev)) continue;
    const p0 = ev.participants?.[0], p1 = ev.participants?.[1];
    if (!p0?.athlete || !p1?.athlete) continue;
    const evTeam = String(ev.team?.id || "");
    if (evTeam && evTeam !== tid) continue;
    changes.push(`<div class="chg"><b>${esc(ev.clock?.displayValue || "")}</b> ${esc(p0.athlete.displayName || p0.athlete.fullName || "?")} <span class="arrow">→</span> ${esc(p1.athlete.displayName || p1.athlete.fullName || "?")}</div>`);
  }
  return `<div class="roster-col" data-tid="${esc(tid)}">
    <div class="roster-head"><b>${esc(r.team?.displayName || "?")}</b><span class="formation">${esc(r.formation || "–")}</span></div>
    <div class="rlabel">Formazione titolare</div>${starters.map(prowHtml).join("") || ""}
    <div class="rlabel">Sostituti</div>${bench.map(prowHtml).join("") || ""}
    ${changes.length ? `<div class="rlabel">Cambi</div>${changes.join("")}` : ""}
  </div>`;
}

function lineupsPanelHtml() {
  const rosters = S.summary?.rosters || [];
  if (!rosters.length) return `<section class="panel"><h2>Formazioni e cambi</h2><p class="muted">Formazioni non ancora disponibili dal feed ESPN.</p></section>`;
  const subs = subsMap();
  const comp = S.match?.competitions?.[0];
  const homeId = comp?.competitors?.find((c) => c.homeAway === "home")?.team?.id;
  return `<section class="panel"><h2>Formazioni e cambi</h2><div class="lineups">${rosters.map((r) => rosterColHtml(r, homeId, subs)).join("")}</div></section>`;
}

/* §10.6 Eventi */
const SVG_SUB = `<span class="sub-svg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 20V6"/><path d="M5.5 9.5 9 6l3.5 3.5"/><path d="M15 4v14"/><path d="M11.5 14.5 15 18l3.5-3.5"/></svg></span>`;
const SVG_WHISTLE = `<span class="whistle-svg"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="7" rx="1.5" fill="currentColor"/><circle cx="12" cy="14" r="8" fill="currentColor"/><circle cx="12" cy="14" r="3" fill="var(--panel-2)"/></svg></span>`;

function eventIcon(p) {
  const t = String(p.type?.type || p.kind || "").toLowerCase();
  const txt = `${p.text || ""} ${p.type?.text || ""}`.toLowerCase();
  if (t.includes("red-card") || t.includes("red card") || t.includes("sending-off") || /red card|sent off/i.test(txt)) return `<span class="ico">🟥</span>`;
  if (txt.includes("yellow") && !txt.includes("red")) return `<span class="ico">🟨</span>`;
  if (t === "goal" || txt.startsWith("goal") || txt.includes(" goal") || t === "penalty-kick-goal" || t === "own-goal") return `<span class="ico">⚽</span>`;
  if (t.includes("sub") || txt.includes("substitution")) return SVG_SUB;
  if (/kickoff|halftime|half time|full ?time|final|stoppage|injury|start-|end-|foul|fall/i.test(t + " " + txt)) return SVG_WHISTLE;
  return `<span class="ico">•</span>`;
}

function eventsPanelHtml() {
  const comp = S.match?.competitions?.[0];
  const homeId = comp?.competitors?.find((c) => c.homeAway === "home")?.team?.id;
  const src = (S.summary?.plays && S.summary.plays.length ? S.summary.plays : S.summary?.keyEvents) || [];
  const evs = src.filter((p) => p.type?.text || p.text || p.clock).sort((a, b) => (b.clock?.value ?? 0) - (a.clock?.value ?? 0));
  if (!evs.length) return `<section class="panel"><h2>Eventi</h2><p class="muted">Nessun evento disponibile nel feed ESPN.</p></section>`;
  const rows = evs.map((p) => {
    const min = p.clock?.displayValue || p.period?.displayValue || "–";
    let text = p.text || p.type?.text || "Evento";
    if (p.team && String(p.team.id) !== String(homeId)) text += " (ospiti)";
    return `<div class="ev"><span class="min">${esc(min)}</span><div>${eventIcon(p)}<span>${esc(text)}</span></div></div>`;
  }).join("");
  return `<section class="panel"><h2>Eventi della partita</h2><div class="timeline">${rows}</div></section>`;
}

function renderMatch() {
  return scoreboardHtml()
    + `<button type="button" class="backbtn" data-act="back">‹ Tutte le partite</button>`
    + `<div class="grid single">${countdownHtml()}${statsPanelHtml()}${lineupsPanelHtml()}${eventsPanelHtml()}</div>`
    + errBannerHtml() + footerHtml();
}

function render() {
  const app = el("app");
  if (!app) return;
  const isMatch = S.matchId && S.match;
  let scrollSave = null;
  if (isMatch) {
    scrollSave = {};
    const tl = app.querySelector(".timeline");
    if (tl) scrollSave.tl = { top: tl.scrollTop, near: tl.scrollHeight - tl.scrollTop - tl.clientHeight < 24 };
    for (const rc of app.querySelectorAll(".roster-col")) scrollSave["rc:" + rc.dataset.tid] = { top: rc.scrollTop, near: rc.scrollHeight - rc.scrollTop - rc.clientHeight < 24 };
  }
  let h;
  if (S.matchId && !S.match) h = bootPanelHtml() + errBannerHtml() + footerHtml();
  else if (S.matchId && S.match) h = renderMatch();
  else h = renderLanding();
  app.innerHTML = h;
  if (isMatch && scrollSave) {
    const tl = app.querySelector(".timeline");
    if (tl && scrollSave.tl) tl.scrollTop = scrollSave.tl.near ? tl.scrollHeight : scrollSave.tl.top;
    for (const k of Object.keys(scrollSave)) {
      if (k === "tl") continue;
      const rc = app.querySelector(`.roster-col[data-tid="${CSS.escape(k.slice(3))}"]`);
      if (rc && scrollSave[k]) rc.scrollTop = scrollSave[k].near ? rc.scrollHeight : scrollSave[k].top;
    }
  }
  wireActions();
}

function tickCountdown() {
  if (!S.matchId || !S.match?.date) return;
  const root = el("app")?.querySelector(".countdown");
  if (!root) return;
  const diff = new Date(S.match.date).getTime() - Date.now();
  if (diff <= 0) return;
  const d = Math.floor(diff / 864e5), h = Math.floor(diff / 36e5) % 24, m = Math.floor(diff / 6e4) % 60, s = Math.floor(diff / 1000) % 60;
  const setU = (u, v) => { const n = root.querySelector(`.cd-num[data-u="${u}"]`); if (n) n.textContent = String(v).padStart(2, "0"); };
  setU("d", d); setU("h", h); setU("m", m); setU("s", s);
}


/* ===== azioni (§7) ===== */
function openMatch(id) {
  S.matchId = String(id); S.sport = S.league;
  ssSet(SS_EVENT, S.matchId); ssSet(SS_SPORT, S.league); ssSet(SS_LEAGUE, S.league);
  S.match = null; S.summary = null; S.stats = null; S.lastScore = null;
  apply();
}
function goBack() {
  ssDel(SS_EVENT); ssDel(SS_SPORT);
  if (validLeag(S.sport)) { S.league = S.sport; ssSet(SS_LEAGUE, S.league); }
  S.matchId = null; S.sport = null; S.match = null; S.summary = null; S.stats = null; S.lastScore = null;
  apply();
}

function wireActions() {
  const app = el("app");
  for (const row of app.querySelectorAll(".day-row")) {
    row.addEventListener("click", () => openMatch(row.dataset.match));
    row.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openMatch(row.dataset.match); } });
  }
  for (const t of app.querySelectorAll(".lg-tab:not([data-nav])")) t.addEventListener("click", () => switchLeague(t.dataset.league));
  for (const v of app.querySelectorAll(".view-tab")) v.addEventListener("click", () => switchView(v.dataset.view));
  for (const n of app.querySelectorAll("[data-nav]")) n.addEventListener("click", () => { S.weekSel = n.dataset.key; render(); });
  const back = app.querySelector('[data-act="back"]');
  if (back) back.addEventListener("click", goBack);
  const retry = app.querySelector('[data-act="retry"]');
  if (retry) retry.addEventListener("click", boot);
  const ivl = el("ivl");
  if (ivl) ivl.addEventListener("change", () => { S.pollMs = Number(ivl.value) * 1000; startTimers(); });
  const th = el("themeSel");
  if (th) th.addEventListener("change", () => setTheme(th.value));
  const rb = el("resetBtn");
  if (rb) rb.addEventListener("click", () => { ssDel(SS_EVENT); ssDel(SS_LEAGUE); location.reload(); });
}

function switchLeague(slug) {
  S.league = slug; ssSet(SS_LEAGUE, slug);
  S.events = []; S.landingReady = false; S.weekSel = null;
  if (!isCup(slug) && S.view === "hist") { S.view = "oggi"; ssSet(SS_VIEW, "oggi"); }
  apply();
}

function switchView(view) {
  if (S.view === view) return;
  S.view = view; ssSet(SS_VIEW, view);
  S.landingReady = false; S.weekSel = null;
  apply();
}

/* ===== init ===== */
setTheme(currentTheme());
boot();

</script>
